version: '3.8'

networks:
  todoapp-network:
    driver: bridge

services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: todoapp-web
    ports:
      - '8080:8080'
    depends_on:
      - db
    restart: unless-stopped
    environment:
      - DB_HOST=db
      - DB_PORT=3306
      - DB_NAME=app_db
      - DB_USER=app_user
      - DB_PASSWORD=1234
    networks:
      - todoapp-network

  db:
    build:
      context: .
      dockerfile: Dockerfile.mysql
    container_name: todoapp-db
    ports:
      - '3306:3306'
    volumes:
      - todoapp-db-data:/var/lib/mysql
    environment:
      - MYSQL_ROOT_PASSWORD=1234
      - MYSQL_DATABASE=app_db
      - MYSQL_USER=app_user
      - MYSQL_PASSWORD=1234
    networks:
      - todoapp-network

volumes:
  todoapp-db-data:
